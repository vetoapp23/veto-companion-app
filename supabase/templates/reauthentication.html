<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code de vérification VetoCrm</title>
</head>
<body style="margin:0;padding:0;background:#eef7f5;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#07131f;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef7f5;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #d1e5e1;box-shadow:0 12px 40px rgba(15,118,110,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#0b3d3a 0%,#0f766e 100%);padding:28px 28px 24px;">
              <p style="margin:0;font-size:22px;font-weight:800;letter-spacing:-0.04em;color:#ffffff;">
                Veto<span style="color:#5eead4;">Crm</span>
              </p>
              <p style="margin:8px 0 0;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(244,251,249,0.75);font-weight:600;">
                Vérification
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px 8px;">
              <h1 style="margin:0 0 16px;font-size:22px;line-height:1.25;letter-spacing:-0.03em;font-weight:800;color:#07131f;">
                Votre code de sécurité
              </h1>
              <p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#5a6b73;">
                Utilisez le code ci-dessous pour confirmer cette action sensible sur VetoCrm.
              </p>
              <p style="margin:0;font-size:14px;line-height:1.6;color:#5a6b73;">
                Ne partagez jamais ce code. Il expire rapidement.
              </p>
              <div style="margin:28px 0;padding:20px 16px;background:#eef7f5;border:1px solid #d1e5e1;border-radius:14px;text-align:center;">
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#0f766e;font-weight:700;">Code</p>
                <p style="margin:0;font-size:32px;letter-spacing:0.35em;font-weight:800;color:#07131f;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{ .Token }}</p>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px;">
              <hr style="border:none;border-top:1px solid #d1e5e1;margin:24px 0;" />
              <p style="margin:0;font-size:12px;line-height:1.55;color:#5a6b73;">
                © 2026 VetoCrm — CRM vétérinaire pour cliniques et cabinets<br />
                <a href="https://vetocrm.com" style="color:#0f766e;text-decoration:none;font-weight:600;">vetocrm.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
